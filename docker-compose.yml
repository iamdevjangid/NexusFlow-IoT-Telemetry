version: '3.8'

services:
  nexusflow:
    build: .
    container_name: nexusflow-engine
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: nexusflow-prometheus
    ports:
      - "9090:9090"
    depends_on:
      - nexusflow
